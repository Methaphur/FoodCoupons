<!DOCTYPE html>
<html>
<head>
  <title>Coupon Scanner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://unpkg.com/html5-qrcode/html5-qrcode.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; }
    #reader { width: 300px; margin: auto; }
    #result { font-size: 1.2em; margin-top: 20px; }
    #adminForm { margin-top: 40px; padding: 15px; border: 1px solid #ccc; border-radius: 8px; }
    #adminForm input, #adminForm button { margin: 5px; padding: 8px; font-size: 1em; }
  </style>
</head>
<body>
  <h2>Scan Coupon</h2>
  <div id="reader"></div>
  <p id="result">Waiting for scan...</p>

  <!-- Admin Section -->
  <div id="adminForm">
    <h3>Admin: Update Coupon Usage</h3>
    <form id="updateForm">
      <input type="text" id="couponID" placeholder="Coupon ID" required>
      <input type="number" id="used" min="0" placeholder="Times Used" required>
      <button type="submit">Update</button>
    </form>
    <button id="updateLast" style="margin-top:10px;">Update Last Scanned Coupon</button>
    <p id="updateResult"></p>
  </div>

  <script>
    // const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxGKIU0IV4bG-TGt_m8yqpHMCIkPecwBqz5B84MS8JKEaZxzzpnvRSrpmfkEdy533kA/exec";
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzNzvUcyyGxMiwutmNVT6ahffCf-YfMzpSuNt6MUososJN9pTxWJfcJ2ykYpMOJRmiF/exec";
    const resultElem = document.getElementById("result");
    const updateResultElem = document.getElementById("updateResult");

    let lastScannedId = null; // store last scanned coupon

    // === Scanner Logic ===
    function checkCoupon(id) {
      fetch(WEB_APP_URL + "?id=" + encodeURIComponent(id))
        .then(r => r.text())
        .then(txt => {
          resultElem.innerText = txt;
        })
        .catch(err => {
          resultElem.innerText = "⚠️ Error contacting server";
          console.error(err);
        });
    }

    function onScanSuccess(decodedText) {
      lastScannedId = decodedText; // save last scanned coupon ID
      resultElem.innerText = "Scanned: " + decodedText + " (checking...)";
      checkCoupon(decodedText);

      // autofill form Coupon ID
      document.getElementById("couponID").value = decodedText;
    }

    function onScanFailure(error) {
      // ignore errors, scanner keeps running
    }

    let scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
    scanner.render(onScanSuccess, onScanFailure);

    // === Admin Update Logic ===
    document.getElementById("updateForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const couponID = document.getElementById("couponID").value.trim();
      const used = parseInt(document.getElementById("used").value);
      updateCouponUsage(couponID, used);
    });

    document.getElementById("updateLast").addEventListener("click", function() {
      if (!lastScannedId) {
        updateResultElem.innerText = "⚠️ No coupon scanned yet!";
        return;
      }
      const used = parseInt(document.getElementById("used").value);
      if (isNaN(used)) {
        updateResultElem.innerText = "⚠️ Please enter usage count!";
        return;
      }
      updateCouponUsage(lastScannedId, used);
    });

    function updateCouponUsage(couponID, used) {
      fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: couponID, used: used })
      })
      .then(r => r.text())
      .then(txt => {
        updateResultElem.innerText = txt;
      })
      .catch(err => {
        updateResultElem.innerText = "⚠️ Error contacting server";
        console.error(err);
      });
    }
  </script>
</body>
</html>
