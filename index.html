<!DOCTYPE html>
<html>
<head>
  <title>Coupon Scanner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://unpkg.com/html5-qrcode/html5-qrcode.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; }
    #reader { width: 300px; margin: auto; }
    #result { font-size: 1.2em; margin-top: 20px; }
  </style>
</head>
<body>
  <h2>Scan Coupon</h2>
  <div id="reader"></div>
  <p id="result">Waiting for scan...</p>

  <script>
    const resultElem = document.getElementById("result");

    function checkCoupon(id) {
      fetch("https://script.google.com/macros/s/AKfycby7ic5hjsZYunCRW8ZHU9gUufnuV_WRp-zlSmYsWuxt2luRcKi3kVcwPcT3-QmgjQqZ/exec?id=" + encodeURIComponent(id))
        .then(r => r.text())
        .then(txt => {
          resultElem.innerText = txt;
        })
        .catch(err => {
          resultElem.innerText = "⚠️ Error contacting server";
          console.error(err);
        });
    }

    function onScanSuccess(decodedText) {
      resultElem.innerText = "Scanned: " + decodedText + " (checking...)";
      checkCoupon(decodedText);
    }

    function onScanFailure(error) {
      // just ignore, scanner keeps running
    }

    let scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
    scanner.render(onScanSuccess, onScanFailure);
  </script>
</body>
</html>
