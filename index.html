<!DOCTYPE html>
<html>
<head>
  <title>Coupon Scanner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://unpkg.com/html5-qrcode/html5-qrcode.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; }
    #reader { width: 300px; margin: auto; }
    #result, #updateResult { font-size: 1.2em; margin-top: 20px; }
    #manualUpdate { margin-top: 30px; }
    input, button { padding: 8px; margin: 5px; }
  </style>
</head>
<body>
  <h2>Scan Coupon</h2>
  <div id="reader"></div>
  <p id="result">Waiting for scan...</p>

  <div id="manualUpdate">
    <h3>Manual Update</h3>
    <input type="text" id="couponIdInput" placeholder="Enter Coupon ID">
    <input type="number" id="usedCountInput" placeholder="Times Used">
    <button onclick="updateCoupon()">Update</button>
    <p id="updateResult"></p>
  </div>

  <script>
    const resultElem = document.getElementById("result");
    const updateResultElem = document.getElementById("updateResult");
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzmAs1aAYxVdbmlGnW5W240R9qPWmN93Zc2GpbJ51KqNV2QFxBFs7O9LJ3B5UeMKLZR/exec"; // <-- replace with your deployed Apps Script URL

    function checkCoupon(id) {
      fetch(WEB_APP_URL + "?id=" + encodeURIComponent(id))
        .then(r => r.text())
        .then(txt => {
          resultElem.innerText = txt;
        })
        .catch(err => {
          resultElem.innerText = "⚠️ Error contacting server";
          console.error(err);
        });
    }

    function updateCoupon() {
      const couponId = document.getElementById("couponIdInput").value.trim();
      const usedCount = document.getElementById("usedCountInput").value.trim();

      if (!couponId || !usedCount) {
        updateResultElem.innerText = "⚠️ Enter both Coupon ID and Used Count";
        return;
      }

      fetch(WEB_APP_URL + "?update=1&id=" + encodeURIComponent(couponId) + "&used=" + usedCount)
        .then(r => r.text())
        .then(txt => {
          updateResultElem.innerText = txt;
        })
        .catch(err => {
          updateResultElem.innerText = "⚠️ Error contacting server";
          console.error(err);
        });
    }

    function onScanSuccess(decodedText) {
      resultElem.innerText = "Scanned: " + decodedText + " (checking...)";
      checkCoupon(decodedText);
    }

    function onScanFailure(error) {
      // just ignore, scanner keeps running
    }

    let scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
    scanner.render(onScanSuccess, onScanFailure);
  </script>
</body>
</html>
